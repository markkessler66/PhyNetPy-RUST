# Build wheels for every supported platform, run the test suite against
# them, and publish to PyPI when a version tag (v*) is pushed.
#
# Publishing uses PyPI trusted publishing (OpenID Connect) for the
# distribution phynetpy-rs: register this repository and workflow file once
# as a (pending) publisher on https://pypi.org/manage/account/publishing/;
# no API token is stored in the repository.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
      - name: Test the wheel
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          set -e
          python -m venv .ci-venv
          source .ci-venv/bin/activate
          pip install --quiet phynetpy-rs --no-index --no-deps --find-links dist --force-reinstall
          pip install --quiet --find-links dist "phynetpy-rs[test]"
          python -m pytest tests -q -p no:cacheprovider

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
      - name: Test the wheel
        shell: bash
        run: |
          set -e
          python -m venv .ci-venv
          source .ci-venv/bin/activate
          pip install --quiet phynetpy-rs --no-index --no-deps --find-links dist --force-reinstall
          pip install --quiet --find-links dist "phynetpy-rs[test]"
          python -m pytest tests -q -p no:cacheprovider

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist
      - name: Test the wheel
        shell: bash
        run: |
          set -e
          python -m venv .ci-venv
          source .ci-venv/Scripts/activate
          pip install --quiet phynetpy-rs --no-index --no-deps --find-links dist --force-reinstall
          pip install --quiet --find-links dist "phynetpy-rs[test]"
          python -m pytest tests -q -p no:cacheprovider

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux, macos, windows, sdist]
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v7
      - uses: astral-sh/setup-uv@v7
      - name: Publish
        run: uv publish 'wheels-*/*'
