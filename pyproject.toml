[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "phynetpy-rs"
description = "PhyNetPy with a Rust core: a library and framework for phylogenetic network inference, analysis, simulation and tooling. Installs the phynetpy package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Kessler", email = "mak17@rice.edu" }]
requires-python = ">=3.9"
keywords = [
    "phylogenetics",
    "networks",
    "biology",
    "graphical modeling",
    "methods",
    "statistics",
    "bayesian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    "numpy>=1.19.0",
    "matplotlib>=3.3.0",
    "biopython>=1.78",
    "python-nexus",
    "pulp",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "coverage"]
dev = ["pytest", "coverage", "maturin>=1.7,<2.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/markkessler66/PhyNetPy-RUST"
Source = "https://github.com/markkessler66/PhyNetPy-RUST"
"Bug Reports" = "https://github.com/markkessler66/PhyNetPy-RUST/issues"
"Pure-Python PhyNetPy" = "https://github.com/NakhlehLab/PhyNetPy"

[tool.maturin]
python-source = "python"
module-name = "phynetpy._core"
features = ["extension-module"]
# The package version is read from python/phynetpy/_version.py (see
# [tool.maturin] "version" handling below) so the Python and Rust sides
# cannot drift apart.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "RELEASE_NOTES_*.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer-running tests (e.g. MCMC recovery runs); deselect with -m 'not slow'",
]
