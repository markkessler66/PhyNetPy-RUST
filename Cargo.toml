[package]
name = "phynetpy_core"
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
description = "Rust core for PhyNetPy: graph structures, likelihood kernels, and search engines."
license = "MIT"
publish = false

[lib]
name = "phynetpy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39", "indexmap"] }
numpy = "0.30"
indexmap = "2"
rustc-hash = "2"
smallvec = "1"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
nalgebra = "0.35"
thiserror = "2"
libm = "0.2"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
